<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FoodResearch</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>FoodResearch</h1>
            <nav>
                <ul>
                    <li><a href="#idee" title="Idee de recette">Idée de recette</a></li>
                    <li><a href="#recette-du-jour" title="Recette du jour">Recette du jour</a></li>
                    <li><a href="#hasard" title="Des idee aux hasard">Des idée aux hasard</a></li>
                    <li><a href="#explorer-categories" title="Explorer par catégories">Explorer par catégories</a></li>
                </ul>
            </nav>
        </header>
        <main>

            <section id="idee">
                <h2>Trouvez votre prochaine recette</h2>
                <input type="text" id="recherche" placeholder="Rechercher une recette" aria-label="Rechercher une recette par nom"/>
                <select id="categorie" aria-label="Filtrer par catégorie">
                    <option value="">Catégories</option>
                </select>

                <select id="pays" aria-label="Filtrer par zone géographique">
                    <option value="">Zone géographique</option>
                </select>

                <select id="ingredient" aria-label="Filtrer par ingrédient">
                    <option value="">Ingrédient</option>
                </select>
                <div id="resultat"></div>
            </section>

            <section id="recette-du-jour" aria-labelledby="recette-du-jour-titre">
                <h2 id="recette-du-jour-titre">Recette du jour</h2>
                <div class="recette-du-jour-contenu"></div>
            </section>

             <section id="hasard">
                <h2>Des idées au hasard</h2>
                <button type="button" id="autre-recette">Autre sélection</button>
                <div id="recette"></div>
            </section>

            <section id="explorer-categories" aria-label="Explorer par catégories">
                <h2>Explorer par catégories</h2>
                <div id="categorie-grid" class="categorie-grid"></div>

                <div id="categorie-recettes" class="categorie-recettes" hidden>
                    <button type="button" id="retour-categories" class="retour-categories" aria-label="Retour au choix des catégories">
                        <span aria-hidden="true">←</span>
                        <span>Retour</span>
                    </button>
                    <div id="recette-categorie" class="recette-categorie-grid"></div>
                </div>
            </section>

        </main>
        <footer>
            <h3>FoodResearch</h3>
            <p>Données fournies par <a href="https://www.themealdb.com/" target="_blank">TheMealDB</a>· Projet UE L220 — JavaScript avancé</p>
        </footer>
        <script src='https://code.jquery.com/jquery-4.0.0.min.js'></script>
        <script src="script.js"></script>
        <script src="recette-modal.js"></script>
        <script src="recette-du-jour.js"></script>
        <script src="filtre.js"></script>
    </body>
</html>
